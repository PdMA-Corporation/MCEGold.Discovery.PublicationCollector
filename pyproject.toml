[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mcegold-discovery-publication-collector"
version = "0.1.0"
description = "Stage 1 MCEGold measurement publication collector using the Connector CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PdMA" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mcegold-publication-collector = "mcegold_discovery_publication_collector.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
